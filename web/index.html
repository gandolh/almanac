<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="A personal calendar." />
    <!-- The ground of the light theme, as the manifest's; the script below and layout/theme.ts change both metas with the theme. -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- The saved theme before the first paint, so a dark choice never flashes light; light on a first visit.
         The colours are --color-ground's two values in styles/index.css (a test keeps them equal). -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = window.localStorage.getItem("almanac.theme");
          if (saved === "dark" || saved === "system") theme = saved;
        } catch (error) {
          // Blocked storage: light.
        }
        var dark =
          theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').content = theme === "system" ? "light dark" : theme;
        document.querySelector('meta[name="theme-color"]').content = dark ? "#131314" : "#FFFFFF";
      })();
    </script>
    <!-- The home-screen icon. No offline: the service worker is for Web Push only and caches nothing (corpus/wiki/decisions.md). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Almanac" />
    <title>Almanac</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
